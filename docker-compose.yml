services:
  backend:
    build: ./backend
    container_name: backend_service
    ports:
      - "4000:3000"
    depends_on:
      - db
    env_file:
      - ./backend/.env

  frontend:
    build: ./canarias-frontend
    container_name: frontend_service
    ports:
      - "3000:3000"
    depends_on:
      - backend

  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
