services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: backend_service
    ports:
      - "4000:3001"
    depends_on:
      - db
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/src:/app/src
      - ./backend/.env:/app/.env
      - backend_node_modules:/app/node_modules

  frontend:
    build: ./canarias-frontend
    container_name: frontend_service
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./canarias-frontend:/app
      - /app/node_modules
    command: pnpm dev

  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
  backend_node_modules:
